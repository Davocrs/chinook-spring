# --- Conexión (los mismos datos de la PG1) ---
spring.datasource.url=jdbc:mariadb://localhost:3306/chinook_autoincrement
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
# none: Hibernate NO toca las tablas, Chinook ya existe
spring.jpa.hibernate.ddl-auto=none
# Usar los nombres de @Table y @Column tal cual (Spring Boot, por defecto, los pasaría a minúsculas con guiones bajos)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Ponlo en true para ver el SQL que genera Spring Data
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Consola limpia: solo lo que escribimos con println ---
spring.main.banner-mode=off
logging.level.root=WARN

# --- Web (UT3) ---
# Puerto del servidor Tomcat (8080 es el valor por defecto)
server.port=8080
# La sesión de Hibernate se cierra al terminar el servicio, no al terminar la petición.
spring.jpa.open-in-view=false
# Mostrar en la consola el mensaje "Tomcat started on port 8080"
logging.level.org.springframework.boot.web.embedded.tomcat=INFO